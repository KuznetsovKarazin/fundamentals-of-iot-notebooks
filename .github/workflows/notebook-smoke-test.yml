name: Notebook smoke test

on:
  push:
    paths:
      - "notebooks/**/*.ipynb"
      - "requirements.txt"
      - ".github/workflows/notebook-smoke-test.yml"
  pull_request:
    paths:
      - "notebooks/**/*.ipynb"
      - "requirements.txt"

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebooks
        run: |
          mkdir -p executed_notebooks
          for nb in notebooks/*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute "$nb" --output-dir executed_notebooks
          done
